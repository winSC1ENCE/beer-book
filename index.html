<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>#TOGETHERNINETY - Bier Book</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        rock: ['"Special Elite"', 'cursive'],
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        beerGold: '#f59e0b',
                        darkBg: '#121212',
                        cardBg: '#1e1e1e',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg text-gray-100 font-sans min-h-screen flex flex-col justify-between">

    <div>
        <!-- Header -->
        <header class="border-b border-gray-800 bg-black/50 sticky top-0 z-50 backdrop-blur">
            <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
                <h1 class="font-rock text-3xl tracking-wider text-beerGold flex items-center gap-2">
                    🍺 #TOGETHERNINETY <span class="text-xs font-sans text-gray-400 bg-gray-800 px-2 py-1 rounded">Bier Book</span>
                </h1>
                <button onclick="openModalForCreate()" class="bg-beerGold hover:bg-amber-600 text-black font-bold px-5 py-2 rounded-lg transition shadow-lg flex items-center gap-2">
                    ➕ Bier eintragen
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="max-w-6xl mx-auto px-4 py-8">
            <!-- Search & Filter -->
            <div class="mb-8 flex flex-col sm:flex-row gap-4 justify-between items-center">
                <input type="text" id="searchInput" placeholder="Suche nach Bier, Brauerei, Stil oder Tags..." 
                    class="w-full sm:w-96 bg-cardBg border border-gray-700 rounded-lg px-4 py-2 focus:outline-none focus:border-beerGold text-sm"
                    oninput="filterBeers()">
                <div id="stats" class="text-sm text-gray-400">Lade Biere...</div>
            </div>

            <!-- Beer Grid -->
            <div id="beerGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Dynamic Cards -->
            </div>
        </main>
    </div>

    <!-- Footer mit Aktualisierungsdatum -->
    <footer class="border-t border-gray-800 bg-black/40 py-4 mt-12 text-center text-xs text-gray-500">
        <p>#TOGETHERNINETY Bier Book &bull; Letzte Aktualisierung: <span id="lastUpdated" class="text-gray-400">Wird geladen...</span></p>
    </footer>

    <!-- Modal für Erstellen & Bearbeiten -->
    <div id="beerModal" class="fixed inset-0 bg-black/80 hidden z-50 flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-cardBg border border-gray-800 rounded-xl max-w-lg w-full p-6 relative my-8 max-h-[90vh] overflow-y-auto">
            <h2 id="modalTitle" class="text-2xl font-rock text-beerGold mb-4">Bier bewerten</h2>
            <form id="beerForm" onsubmit="saveBeer(event)" class="space-y-4">
                <input type="hidden" id="editBeerId" value="">

                <div>
                    <label class="block text-xs uppercase text-gray-400 font-semibold mb-1">Biername</label>
                    <input type="text" id="beerName" required class="w-full bg-black/50 border border-gray-700 rounded-lg px-3 py-2 focus:border-beerGold focus:outline-none text-sm">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs uppercase text-gray-400 font-semibold mb-1">Brauerei / Stil</label>
                        <input type="text" id="brewery" required class="w-full bg-black/50 border border-gray-700 rounded-lg px-3 py-2 focus:border-beerGold focus:outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-xs uppercase text-gray-400 font-semibold mb-1">Alkoholgehalt (% Vol.)</label>
                        <input type="number" id="abv" step="0.1" min="0" max="20" class="w-full bg-black/50 border border-gray-700 rounded-lg px-3 py-2 focus:border-beerGold focus:outline-none text-sm" placeholder="z.B. 5.2">
                    </div>
                </div>

                <!-- Tag Auswahl -->
                <div>
                    <label class="block text-xs uppercase text-gray-400 font-semibold mb-1">Stile & Aromen (Mehrfachauswahl)</label>
                    <input type="text" id="tagSearch" placeholder="Tags durchsuchen..." oninput="filterTagList()" 
                        class="w-full bg-black/50 border border-gray-700 rounded-lg px-3 py-1.5 mb-2 focus:outline-none focus:border-beerGold text-xs">
                    <div id="tagContainer" class="max-h-36 overflow-y-auto bg-black/30 border border-gray-800 rounded-lg p-2 grid grid-cols-2 gap-2 text-xs">
                        <!-- Per JS befüllt -->
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs uppercase text-gray-400 font-semibold mb-1">Erhalten von</label>
                        <input type="text" id="receivedFrom" required class="w-full bg-black/50 border border-gray-700 rounded-lg px-3 py-2 focus:border-beerGold focus:outline-none text-sm" placeholder="z.B. Urs">
                    </div>
                    <div>
                        <label class="block text-xs uppercase text-gray-400 font-semibold mb-1">Wer bewertet?</label>
                        <select id="reviewer" class="w-full bg-black/50 border border-gray-700 rounded-lg px-3 py-2 focus:border-beerGold focus:outline-none text-sm">
                            <option value="Nico">Nico</option>
                            <option value="Adi">Adi</option>
                            <option value="Beide">Beide (Nico & Adi)</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs uppercase text-gray-400 font-semibold mb-1">Punkte (1-5)</label>
                    <input type="number" id="rating" min="1" max="5" step="0.5" value="4" required class="w-full bg-black/50 border border-gray-700 rounded-lg px-3 py-2 focus:border-beerGold focus:outline-none text-sm">
                </div>

                <div>
                    <label class="block text-xs uppercase text-gray-400 font-semibold mb-1">Kommentar / Notizen</label>
                    <textarea id="comment" rows="2" class="w-full bg-black/50 border border-gray-700 rounded-lg px-3 py-2 focus:border-beerGold focus:outline-none text-sm" placeholder="Geschmack, Besonderheiten..."></textarea>
                </div>
                <div>
                    <label class="block text-xs uppercase text-gray-400 font-semibold mb-1">Foto der Flasche (Optional)</label>
                    <input type="file" id="beerImage" accept="image/*" class="w-full text-xs text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-beerGold file:text-black hover:file:bg-amber-600 cursor-pointer">
                </div>
                <div class="flex justify-end gap-3 pt-4">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg bg-gray-800 hover:bg-gray-700 text-sm transition">Abbrechen</button>
                    <button type="submit" id="submitBtn" class="px-5 py-2 rounded-lg bg-beerGold hover:bg-amber-600 text-black font-bold text-sm transition">Speichern</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JS Logik -->
    <script>
        const SUPABASE_URL = 'https://smzmoqfpborgjtfnkwez.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNtem1vcWZwYm9yZ2p0Zm5rd2V6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1NDkzOTQsImV4cCI6MjEwOTEyNTM5NH0._65cILLVxiD3jV8S4Jeh1Nydecdm8zdJ5qRg2idG_gU';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const availableTags = [
            "Fruchtig", "Citrus", "Tropisch", "Blumig", "Malzig", "Karamell", 
            "Röstig", "Schokolade", "Kaffee", "Hopfig", "Bitter", "Harzig", 
            "Würzig", "Rauchig", "Säuerlich", "Beeren", "Vanille", "Holzfass", 
            "Helles", "Pils", "IPA", "Pale Ale", "Stout", "Porter", "Weizen", "Belgian Ale", "Sour"
        ];

        let allBeers = [];

        document.addEventListener('DOMContentLoaded', () => {
            fetchBeers();
            renderTagCheckboxes(availableTags);
            setLastUpdatedTimestamp();
        });

        function setLastUpdatedTimestamp() {
            const now = new Date();
            const formatted = now.toLocaleDateString('de-CH', { day: '2-digit', month: '2-digit', year: 'numeric' }) + 
                              ' um ' + now.toLocaleTimeString('de-CH', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('lastUpdated').innerText = formatted;
        }

        function renderTagCheckboxes(tags, checkedTags = []) {
            const container = document.getElementById('tagContainer');
            container.innerHTML = tags.map(tag => {
                const isChecked = checkedTags.includes(tag) ? 'checked' : '';
                return `
                    <label class="flex items-center gap-2 cursor-pointer hover:text-beerGold transition p-1 bg-black/20 rounded">
                        <input type="checkbox" name="beerTag" value="${tag}" ${isChecked} class="rounded bg-black border-gray-700 text-beerGold focus:ring-0">
                        <span class="truncate">${tag}</span>
                    </label>
                `;
            }).join('');
        }

        function filterTagList() {
            const query = document.getElementById('tagSearch').value.toLowerCase();
            const filtered = availableTags.filter(t => t.toLowerCase().includes(query));
            const selected = Array.from(document.querySelectorAll('input[name="beerTag"]:checked')).map(cb => cb.value);
            renderTagCheckboxes(filtered, selected);
        }

        async function fetchBeers() {
            const { data, error } = await _supabase.from('beers').select('*').order('created_at', { ascending: false });
            if (error) {
                console.error('Fehler beim Laden:', error);
                document.getElementById('beerGrid').innerHTML = '<p class="text-red-500 col-span-full text-center">Fehler beim Laden der Daten.</p>';
                return;
            }
            allBeers = data;
            renderBeers(allBeers);
        }

        function renderBeers(beers) {
            const grid = document.getElementById('beerGrid');
            document.getElementById('stats').innerText = `${beers.length} Biere in der Challenge`;
            
            if (beers.length === 0) {
                grid.innerHTML = '<p class="text-gray-500 col-span-full text-center py-12">Noch keine Biere eingetragen.</p>';
                return;
            }

            grid.innerHTML = beers.map(beer => {
                const tagsArray = beer.tags ? beer.tags.split(',').map(t => `<span class="bg-gray-800 text-gray-300 px-2 py-0.5 rounded text-[10px]">${t.trim()}</span>`).join('') : '';
                const abvText = beer.abv ? `${beer.abv}% Vol.` : '';

                return `
                    <div class="bg-cardBg border border-gray-800 rounded-xl overflow-hidden flex flex-col justify-between shadow-xl hover:border-gray-700 transition relative group">
                        <div>
                            <!-- Action Buttons oben rechts -->
                            <div class="absolute top-2 right-2 flex gap-1 z-10 opacity-90 group-hover:opacity-100 transition">
                                <button onclick="openModalForEdit(${beer.id})" class="bg-black/70 hover:bg-beerGold hover:text-black text-white p-2 rounded-lg text-xs backdrop-blur" title="Bearbeiten">✏️</button>
                                <button onclick="deleteBeer(${beer.id})" class="bg-black/70 hover:bg-red-600 text-white p-2 rounded-lg text-xs backdrop-blur" title="Löschen">🗑️</button>
                            </div>

                            ${beer.image_url ? `<img src="${beer.image_url}" class="w-full h-48 object-cover">` : '<div class="w-full h-48 bg-gray-900 flex items-center justify-center text-gray-600 font-rock text-xl">#TOGETHERNINETY</div>'}
                            <div class="p-5">
                                <div class="flex justify-between items-start gap-2 mb-2">
                                    <div>
                                        <h3 class="font-bold text-lg text-white">${beer.name}</h3>
                                        <p class="text-xs text-beerGold">${beer.brewery} ${abvText ? `• <span class="text-gray-400">${abvText}</span>` : ''}</p>
                                    </div>
                                    <span class="bg-amber-500/10 text-beerGold border border-amber-500/20 px-2.5 py-1 rounded-lg text-sm font-bold">⭐ ${beer.rating}</span>
                                </div>
                                ${tagsArray ? `<div class="flex flex-wrap gap-1 mb-3">${tagsArray}</div>` : ''}
                                <p class="text-sm text-gray-300 italic mb-4">"${beer.comment || 'Kein Kommentar'}"</p>
                            </div>
                        </div>
                        <div class="px-5 py-3 bg-black/30 border-t border-gray-800/60 flex justify-between text-xs text-gray-400">
                            <span>🎁 Von: <strong class="text-gray-200">${beer.received_from}</strong></span>
                            <span>✍️ Bewertet von: <strong class="text-gray-200">${beer.reviewer}</strong></span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterBeers() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allBeers.filter(b => 
                b.name.toLowerCase().includes(query) || 
                b.brewery.toLowerCase().includes(query) || 
                b.received_from.toLowerCase().includes(query) ||
                (b.tags && b.tags.toLowerCase().includes(query))
            );
            renderBeers(filtered);
        }

        function openModalForCreate() {
            document.getElementById('modalTitle').innerText = 'Neues Bier bewerten';
            document.getElementById('editBeerId').value = '';
            document.getElementById('beerForm').reset();
            renderTagCheckboxes(availableTags, []);
            document.getElementById('beerModal').classList.remove('hidden');
        }

        function openModalForEdit(id) {
            const beer = allBeers.find(b => b.id === id);
            if (!beer) return;

            document.getElementById('modalTitle').innerText = 'Bier bearbeiten';
            document.getElementById('editBeerId').value = beer.id;
            document.getElementById('beerName').value = beer.name;
            document.getElementById('brewery').value = beer.brewery;
            document.getElementById('abv').value = beer.abv || '';
            document.getElementById('receivedFrom').value = beer.received_from;
            document.getElementById('reviewer').value = beer.reviewer;
            document.getElementById('rating').value = beer.rating;
            document.getElementById('comment').value = beer.comment || '';

            const currentTags = beer.tags ? beer.tags.split(',').map(t => t.trim()) : [];
            renderTagCheckboxes(availableTags, currentTags);

            document.getElementById('beerModal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('beerModal').classList.add('hidden'); }

        async function deleteBeer(id) {
            if (!confirm('Möchtest du dieses Bier wirklich löschen?')) return;
            const { error } = await _supabase.from('beers').delete().eq('id', id);
            if (error) {
                alert('Fehler beim Löschen: ' + error.message);
            } else {
                fetchBeers();
            }
        }

        async function saveBeer(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = 'Speichere...';
            btn.disabled = true;

            const editId = document.getElementById('editBeerId').value;
            const name = document.getElementById('beerName').value;
            const brewery = document.getElementById('brewery').value;
            const abv = document.getElementById('abv').value ? parseFloat(document.getElementById('abv').value) : null;
            const receivedFrom = document.getElementById('receivedFrom').value;
            const reviewer = document.getElementById('reviewer').value;
            const rating = parseFloat(document.getElementById('rating').value);
            const comment = document.getElementById('comment').value;
            
            const selectedTags = Array.from(document.querySelectorAll('input[name="beerTag"]:checked')).map(cb => cb.value).join(', ');

            const fileInput = document.getElementById('beerImage');
            let imageUrl = null;

            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const cleanFileName = file.name.replace(/[^a-zA-Z0-9.]/g, '_');
                const fileName = `${Date.now()}_${cleanFileName}`;

                const { data: uploadData, error: uploadError } = await _supabase.storage
                    .from('beer-images')
                    .upload(fileName, file, { cacheControl: '3600', upsert: true });
                
                if (uploadError) {
                    alert('Fehler beim Bild-Upload: ' + uploadError.message);
                    btn.innerText = 'Speichern';
                    btn.disabled = false;
                    return;
                }

                const { data: publicUrlData } = _supabase.storage
                    .from('beer-images')
                    .getPublicUrl(fileName);

                if (publicUrlData && publicUrlData.publicUrl) {
                    imageUrl = publicUrlData.publicUrl;
                }
            }

            const payload = {
                name, brewery, abv, tags: selectedTags, received_from: receivedFrom, reviewer, rating, comment
            };

            if (imageUrl) {
                payload.image_url = imageUrl;
            }

            let response;
            if (editId) {
                response = await _supabase.from('beers').update(payload).eq('id', editId);
            } else {
                response = await _supabase.from('beers').insert([payload]);
            }

            btn.innerText = 'Speichern';
            btn.disabled = false;

            if (response.error) {
                alert('Fehler beim Speichern: ' + response.error.message);
            } else {
                closeModal();
                document.getElementById('beerForm').reset();
                fetchBeers();
            }
        }
    </script>
</body>
</html>
